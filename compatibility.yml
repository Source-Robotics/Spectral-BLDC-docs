# Which firmware release works with what. One row per firmware release, newest first. hooks/firmware_pages.py
# writes it into the "Versions and compatibility" page (<!-- compatibility-table -->); tools/test_tools.py checks
# that docs_version has a row. The firmware repository has no compatibility file of its own, so this is the source.
columns:
  - {key: firmware, title: Firmware}
  - {key: date, title: Released}
  - {key: bootloader, title: Bootloader}
  - {key: stepfoc, title: STEPFOC equivalent}
  - {key: python, title: Python library (Spectral-BLDC)}
  - {key: runtime, title: PAR6 runtime}
  - {key: pcb, title: Spectral Micro PCB}
  - {key: docs, title: Docs}

rows:
  - firmware: "109"
    date: 2026-11-10
    bootloader: required
    stepfoc: "109 (from 109 the two share their version numbers; there is no Spectral Micro 108)"
    python: "1.21 or newer (the calls for the commands added in 109: parameters, identity, telemetry, buffers, the watchdog's coast and descend)"
    runtime: 0.9 or newer (it sends watchdog action 0, the legacy response)
    pcb: v2.0
    docs: "109"
  - firmware: "107"
    date: 2026-08-26
    bootloader: required
    stepfoc: 108 (STEPFOC 107 has the Send_Settings and PD changes of this release, without its calibration fix)
    python: 1.20 or newer
    runtime: 0.9 or newer
    pcb: v2.0
    docs: "107"
  - firmware: "106"
    date: 2026-07-06
    bootloader: required
    stepfoc: "106"
    python: 1.19 or newer
    runtime: 0.9 or newer
    pcb: v2.0
    docs: not published
  - firmware: "105"
    date: 2026-07-05
    bootloader: required
    stepfoc: "105"
    python: 1.19 or newer
    runtime: 0.9 or newer
    pcb: v2.0
    docs: not published
  - firmware: "104"
    date: 2026-06-19
    bootloader: required (the first release built for the bootloader, from Bootloader_main)
    stepfoc: none (STEPFOC has no 104 release)
    python: 1.19 or newer (1.20 for Send_Voltage_Limit)
    runtime: 0.9 or newer
    pcb: v2.0
    docs: "101 applies; 104 adds Send_Respond_Kt, Send_Voltage_Limit (in the release image) and the bootloader"
  - firmware: "101"
    date: 2025-09-29
    bootloader: none (flashed with a programming adapter)
    stepfoc: "103"
    python: 1.17 or newer
    runtime: 0.9 or newer
    pcb: v2.0
    docs: "101"
