# The hand-written half of the CAN reference: what each message is for, the byte layout of each form, the Python
# call. The other half (the command IDs, the lengths the firmware accepts, the responses, the frame lengths the
# driver sends) comes from the firmware at its release tag (generated/firmware_facts.json), and the build fails when
# the two disagree. Keys are the firmware's #define names. Bytes are numbered from 0 = data[0], the first byte on
# the bus; multi-byte values are big-endian. Bits are numbered from the most significant bit: bit 7 is the first
# flag the firmware packs into a byte (bitsToByte: byte |= 1 << (7 - i)), bit 0 the last.

groups:
  motion:
    title: Motion
    page: motion.md
  gains:
    title: Gains and limits
    page: gains-and-limits.md
  status:
    title: Status requests
    page: status.md
  system:
    title: System
    page: system.md
  parameters:
    title: Parameters and buffers
    page: parameters.md
  sound:
    title: Sound
    page: sound.md
  gripper:
    title: Gripper
    page: gripper.md

commands:
  # ------------------------------------------------------------ motion
  IN_DATA_PACK_1:
    name: Send_data_pack_1
    group: motion
    python: Send_data_pack_1()
    description: >
      The motion command. Its length decides the control mode the driver enters: 8 bytes command a position with a
      speed and a current feedforward, 5 bytes a speed with a current feedforward, 2 bytes a current. Send 0 for a
      feedforward you do not use. A frame of any other length is ignored (the driver flags it as a wrong data
      length) but still answered.
    forms:
      - length: 8
        title: position setpoint with speed and current feedforward (position mode)
        fields:
          - {bytes: "0-2", name: Position setpoint, type: signed 24-bit, meaning: encoder ticks}
          - {bytes: "3-5", name: Speed feedforward, type: signed 24-bit, meaning: encoder ticks/s}
          - {bytes: "6-7", name: Current feedforward, type: signed 16-bit, meaning: mA}
      - length: 5
        title: speed setpoint with current feedforward (velocity mode)
        fields:
          - {bytes: "0-2", name: Speed setpoint, type: signed 24-bit, meaning: encoder ticks/s}
          - {bytes: "3-4", name: Current feedforward, type: signed 16-bit, meaning: mA}
      - length: 2
        title: current setpoint (current mode)
        fields:
          - {bytes: "0-1", name: Current setpoint, type: signed 16-bit, meaning: mA}
    notes: >
      Every form resets the watchdog. With `Rstint` set, the integral accumulators are cleared on each new setpoint.
      From firmware 109 a position or speed frame that follows another mode (idle, current, PD, a watchdog trip)
      starts the velocity integral from zero, so a release from a wound-up mode does not kick; one that follows
      position or velocity mode keeps it. The new setpoint, the mode change and the driver's wake-up reach the
      control loop together, so the first frame after Idle is followed.
  IN_DATA_PACK_PD:
    name: Send_data_pack_PD
    group: motion
    python: Send_data_pack_PD()
    description: >
      Puts the driver in impedance (PD) mode and sets the position, speed and current feedforward of the PD loop,
      whose gains are KP and KD (Send_PD_Gains).
    forms:
      - length: 8
        fields:
          - {bytes: "0-2", name: Position setpoint, type: signed 24-bit, meaning: encoder ticks}
          - {bytes: "3-5", name: Speed setpoint, type: signed 24-bit, meaning: encoder ticks/s}
          - {bytes: "6-7", name: Current feedforward, type: signed 16-bit, meaning: mA}
    notes: >
      Firmware 106 and older wrote the speed into the feedforward instead of the PD loop's speed setpoint, so the
      speed term had no effect; 107 fixed it.
  OUT_DATA_PACK_1:
    name: Respond_data_pack_1
    group: motion
    description: >
      The driver's answer to Send_data_pack_1 and Send_data_pack_PD: where the motor is, how fast it turns and the
      current it draws. The Python library stores them as `position`, `speed` and `current`.
    response_fields:
      - {bytes: "0-2", name: position, type: signed 24-bit, meaning: encoder ticks}
      - {bytes: "3-5", name: speed, type: signed 24-bit, meaning: encoder ticks/s}
      - {bytes: "6-7", name: current, type: signed 16-bit, meaning: Iq in mA}
  IN_DATA_PACK_2:
    name: Send_data_pack_2
    group: motion
    description: Reserved. The firmware has no handler for this ID and the Python library's call does nothing.
  IN_DATA_PACK_3:
    name: Send_data_pack_3
    group: motion
    description: Reserved. The firmware has no handler for this ID and the Python library's call does nothing.
  OUT_DATA_PACK_2:
    name: Respond_data_pack_2
    group: motion
    description: Reserved; the driver never sends it.
  OUT_DATA_PACK_3:
    name: Respond_data_pack_3
    group: motion
    description: Reserved; the driver never sends it.
  IN_IQ:
    name: Send_Iq
    group: motion
    description: Reserved; the firmware has no handler for this ID. Use the 2-byte form of Send_data_pack_1 for a current setpoint.

  # ------------------------------------------------------------ gains and limits
  IN_KP_KD:
    name: Send_PD_Gains
    group: gains
    python: Send_PD_Gains()
    description: Sets KP and KD, the gains of the impedance (PD) loop. Keep them with Send_Save_config.
    forms:
      - length: 8
        fields:
          - {bytes: "0-3", name: KP, type: float 32, meaning: ""}
          - {bytes: "4-7", name: KD, type: float 32, meaning: ""}
  IN_KIIQ_KPIQ:
    name: Send_Current_Gains
    group: gains
    python: Send_Current_Gains()
    description: >
      Sets Kp and Ki of the PI current loop of Iq. The Id loop keeps its gains; over UART, `#Kpiq` and `#Kiiq` set
      both loops, and so do parameters 11 and 12.
    forms:
      - length: 8
        fields:
          - {bytes: "0-3", name: Kp_iq, type: float 32, meaning: ""}
          - {bytes: "4-7", name: Ki_iq, type: float 32, meaning: ""}
  IN_KPV_KIV:
    name: Send_Velocity_Gains
    group: gains
    python: Send_Velocity_Gains()
    description: Sets Kp and Ki of the PI velocity loop.
    forms:
      - length: 8
        fields:
          - {bytes: "0-3", name: Kpv, type: float 32, meaning: ""}
          - {bytes: "4-7", name: Kiv, type: float 32, meaning: ""}
  IN_KPP:
    name: Send_Position_Gains
    group: gains
    python: Send_Position_Gains()
    description: Sets Kp of the P position loop.
    forms:
      - length: 4
        fields:
          - {bytes: "0-3", name: Kpp, type: float 32, meaning: ""}
  IN_LIMITS:
    name: Send_Limits
    group: gains
    python: Send_Limits()
    description: >
      Sets the speed limit and the current limit the loops may reach. From firmware 109 a negative value, or one
      that is not a number, is ignored, and the current limit stops at the driver's 2800 mA, as with `#Ilim`.
      Firmware 107 and older stored the current limit as it arrived. Never send more than the motor's rating.
    forms:
      - length: 8
        fields:
          - {bytes: "0-3", name: Speed limit, type: float 32, meaning: encoder ticks/s}
          - {bytes: "4-7", name: Current limit, type: float 32, meaning: mA}
  IN_KT:
    name: Send_Kt
    group: gains
    python: Send_Kt()
    description: Sets the motor's torque constant Kt, which the driver uses to estimate torque from current.
    forms:
      - length: 4
        fields:
          - {bytes: "0-3", name: Kt, type: float 32, meaning: Nm/A}
  IN_VLIM:
    name: Send_Voltage_Limit
    group: gains
    python: Send_Voltage_Limit()
    description: >
      Sets the voltage limit of the current loops (the same value as `#Vlim`), in mV. 0 means use the supply
      voltage. In the 104 release image (the source at tag V104 does not have it yet) and in every release from
      105. From firmware 109 it takes 0 to 60000 mV, as parameter 17 does; a value outside is ignored.
    forms:
      - length: 4
        fields:
          - {bytes: "0-3", name: Voltage limit, type: signed 32-bit, meaning: mV; 0 = Vbus}

  # ------------------------------------------------------------ status requests
  OUT_IN_PING:
    name: Send_Respond_Ping
    group: status
    python: Send_Respond_Ping()
    description: Asks the driver to answer with an empty frame, to see that it is on the bus.
    response_fields: []
  OUT_IN_TEMPERATURE_CAN:
    name: Send_Respond_Temperature
    group: status
    python: Send_Respond_Temperature()
    description: Asks for the thermistor temperature. Meaningful only with the thermistor enabled (`#Term 1`).
    response_fields:
      - {bytes: "0-1", name: temperature, type: signed 16-bit, meaning: "°C"}
  OUT_IN_VOLTAGE_CAN:
    name: Send_Respond_Voltage
    group: status
    python: Send_Respond_Voltage()
    description: Asks for the supply voltage.
    response_fields:
      - {bytes: "0-1", name: voltage, type: unsigned 16-bit, meaning: mV}
  OUT_IN_DEVICE_INFO_CAN:
    name: Send_Respond_Device_Info
    group: status
    python: Send_Respond_Device_Info()
    description: >
      Asks for the driver's identity: hardware version, batch date and serial number from the EEPROM, and the
      firmware release (from firmware 105 on this is the build's own version; before, a value from the EEPROM).
    response_fields:
      - {bytes: "0", name: HARDWARE_VERSION, type: unsigned 8-bit, meaning: PCB revision}
      - {bytes: "1", name: BATCH_DATE, type: unsigned 8-bit, meaning: "production batch, the lowest 8 bits of the stored value (24092024 after #Default is sent as 120)"}
      - {bytes: "2", name: SOFTWARE_VERSION, type: unsigned 8-bit, meaning: "firmware release, e.g. 107"}
      - {bytes: "3-6", name: SERIAL_NUMBER, type: unsigned 32-bit, meaning: serial number}
  OUT_IN_STATE_OF_ERRORS_CAN:
    name: Send_Respond_State_of_Errors
    group: status
    python: Send_Respond_State_of_Errors()
    description: Asks for every error flag and the calibrated, activated, watchdog and product-lock states.
    response_fields:
      - {bytes: "0", bit: 7, name: error, type: bit, meaning: any error is active}
      - {bytes: "0", bit: 6, name: temperature_error, type: bit, meaning: motor over the temperature limit, _shared: true}
      - {bytes: "0", bit: 5, name: encoder_error, type: bit, meaning: magnet not detected or misaligned, _shared: true}
      - {bytes: "0", bit: 4, name: vbus_error, type: bit, meaning: supply voltage outside the limits, _shared: true}
      - {bytes: "0", bit: 3, name: driver_error, type: bit, meaning: "the MOSFET driver reports undervoltage, thermal shutdown or overcurrent", _shared: true}
      - {bytes: "0", bit: 2, name: velocity_error, type: bit, meaning: speed over the limit, _shared: true}
      - {bytes: "0", bit: 1, name: current_error, type: bit, meaning: reserved; never set by this firmware, _shared: true}
      - {bytes: "0", bit: 0, name: estop_error, type: bit, meaning: "Send_ESTOP was received (from firmware 110 also #Estop over UART)", _shared: true}
      - {bytes: "1", bit: 7, name: calibrated, type: bit, meaning: the motor is calibrated}
      - {bytes: "1", bit: 6, name: activated, type: bit, meaning: the controller is activated, _shared: true}
      - {bytes: "1", bit: 5, name: watchdog_error, type: bit, meaning: the watchdog ran out, _shared: true}
      - {bytes: "1", bit: 4, name: wrong_product, type: bit, meaning: "from firmware 109: this firmware is on the other product's board (the product lock) and drives nothing", _shared: true}
  OUT_IN_IQ:
    name: Send_Respond_Iq_data
    group: status
    python: Send_Respond_Iq_data()
    description: Asks for the measured Iq current.
    response_fields:
      - {bytes: "0-1", name: current, type: signed 16-bit, meaning: mA}
  OUT_IN_ENCODER:
    name: Send_Respond_Encoder_data
    group: status
    python: Send_Respond_Encoder_data()
    description: Asks for the position and the filtered speed, as 32-bit values. Python attributes `position` and `speed`.
    response_fields:
      - {bytes: "0-3", name: position, type: signed 32-bit, meaning: encoder ticks}
      - {bytes: "4-7", name: speed, type: signed 32-bit, meaning: encoder ticks/s}
  OUT_IN_KT:
    name: Send_Respond_Kt
    group: status
    python: Send_Respond_Kt()
    description: Asks for the torque constant Kt the driver uses. Added in firmware 104.
    response_fields:
      - {bytes: "0-3", name: Kt, type: float 32, meaning: Nm/A}
  OUT_IN_IDENTITY:
    name: Send_Respond_Identity
    group: status
    python: Send_Respond_Identity()
    description: >
      Asks what the drive is: the product, the tool it is built into, the firmware release, the hardware version,
      the pole pairs, whether it is calibrated, and eight flags. A host can check it before it commands or flashes
      a drive. Added in firmware 109. Python attributes `product_id`, `product_name`, `tool_id`,
      `firmware_version`, `identity_hardware_version`, `pole_pairs`, `identity_calibrated`, `identity_flags`.
    response_fields:
      - {bytes: "0", name: product, type: unsigned 8-bit, meaning: "1 STEPFOC, 2 Spectral Micro: the firmware that answers"}
      - {bytes: "1", name: tool_id, type: unsigned 8-bit, meaning: "parameter 1: 0 none, 1 SSG-48, 11-33 MSG, 200-254 your own"}
      - {bytes: "2-3", name: firmware_version, type: unsigned 16-bit, meaning: "the release, e.g. 109"}
      - {bytes: "4", name: hardware_version, type: unsigned 8-bit, meaning: PCB revision from the EEPROM}
      - {bytes: "5", name: pole_pairs, type: unsigned 8-bit, meaning: "the motor's pole pairs; 0 if outside 0-255"}
      - {bytes: "6", name: calibrated, type: unsigned 8-bit, meaning: "1 calibrated, 0 not"}
      - {bytes: "7", bit: 0, name: gripper, type: bit, meaning: "the driver is set up as a gripper (#Gripper 1)"}
      - {bytes: "7", bit: 1, name: brake_on_idle, type: bit, meaning: "idle brakes (1) or coasts (0)", _shared: true}
      - {bytes: "7", bit: 2, name: commutation_reversed, type: bit, meaning: calibration found the coils wired the other way round, _shared: true}
      - {bytes: "7", bit: 3, name: settings_block2, type: bit, meaning: "the EEPROM has the bank settings block 2 lives in, so parameters 1-5 can be saved", _shared: true}
      - {bytes: "7", bit: 4, name: wrong_product, type: bit, meaning: "this firmware is on the other product's board (the product lock) and drives nothing", _shared: true}
      - {bytes: "7", bit: 5, name: sense_zero_measured, type: bit, meaning: the current-sense zero was measured at start-up and is plausible, _shared: true}
      - {bytes: "7", bit: 6, name: cogging_saved, type: bit, meaning: the anti-cogging in use is the one saved in the EEPROM, _shared: true}
      - {bytes: "7", bit: 7, name: switching_zero_in_use, type: bit, meaning: "the current-sense zero measured with the bridge switching is in use (parameter 46)", _shared: true}
    notes: >
      The flags in byte 7 are numbered the usual way, bit 0 the least significant (unlike the error bytes, which
      the firmware packs from bit 7 down).
  OUT_IN_TELEMETRY:
    name: Send_Respond_Telemetry
    group: status
    python: Send_Respond_Telemetry()
    description: >
      Asks for the temperature, the supply voltage, both error bytes and the current in one frame, all from the
      same moment: one request instead of four. Added in firmware 109. The Python library fills the same
      attributes as the four separate answers.
    response_fields:
      - {bytes: "0-1", name: temperature, type: signed 16-bit, meaning: "°C (meaningful with the thermistor enabled)"}
      - {bytes: "2-3", name: voltage, type: signed 16-bit, meaning: supply voltage in mV}
      - {bytes: "4", name: errors_1, type: unsigned 8-bit, meaning: "the error flags, as byte 0 of Send_Respond_State_of_Errors"}
      - {bytes: "5", name: errors_2, type: unsigned 8-bit, meaning: "calibrated, activated, watchdog, wrong product, as byte 1 of Send_Respond_State_of_Errors"}
      - {bytes: "6-7", name: current, type: signed 16-bit, meaning: Iq in mA}
  OUT_HEARTBEAT:
    name: Respond_Heartbeat
    group: status
    description: >
      The frame the driver sends on its own at the heartbeat interval (Send_Heartbeat_Setup); empty. Off by
      default. Any other frame the driver sends resets the heartbeat timer, so a driver that answers motion commands
      at a high rate never sends a heartbeat.
    response_fields: []

  # ------------------------------------------------------------ system
  IN_CAN_ID:
    name: Send_CAN_ID
    group: system
    python: Send_CAN_ID()
    description: >
      Gives the driver a new node ID, 0 to 13 (the firmware accepts up to 15, but the bootloader reserves 14 and 15:
      a driver on one of those cannot be updated over CAN). The driver answers to the new ID at once. The ID is
      kept over a power cycle only after Send_Save_config, and saving is also what copies it into the bootloader's
      board ID.
    forms:
      - length: 1
        fields:
          - {bytes: "0", name: ID, type: unsigned 8-bit, meaning: "0 to 13 (14 and 15 are accepted but reserved by the bootloader)"}
  IN_ESTOP:
    name: Send_ESTOP
    group: system
    python: Send_ESTOP()
    description: Stops the motor and raises the E-stop error, which stays until Send_Clear_Error.
  IN_IDLE:
    name: Send_Idle
    group: system
    python: Send_Idle()
    description: >
      Puts the driver in idle mode: the motor coasts, or brakes when Send_Settings or `#Brake 1` asked for it.
  IN_SAVE_CONFIG:
    name: Send_Save_config
    group: system
    python: Send_Save_config()
    description: >
      Writes the current configuration (gains, limits, calibration, CAN ID, heartbeat, watchdog, gripper flag) to
      the EEPROM, and copies the CAN ID into the bootloader's board ID. From firmware 109 it also writes the tool id
      and the watchdog fallback (settings block 2), the anti-cogging set with its mode and scale, and the encoder
      table with its on/off flag, parameter 56 and the current-sense zero trims, each block with its own checksum;
      of the two large blocks only the 16-byte pages that changed are written. From firmware 110 it also writes the
      idle behaviour of Send_Settings (parameter 18). Not kept: the current loop bandwidth, and every parameter the
      parameter table marks as not kept. A drive
      stopped by the product lock writes nothing.
  IN_RESET:
    name: Send_Reset
    group: system
    python: Send_Reset()
    description: >
      Resets the driver. From firmware 104 the reset lands in the bootloader, which waits 2 s for a flashing host
      and then starts the firmware again; this is how a firmware update begins.
  IN_CLEAR_ERROR:
    name: Send_Clear_Error
    group: system
    python: Send_Clear_Error()
    description: >
      Clears the error flags and goes to idle; it also ends a watchdog hold or descend. An error whose cause is
      still present comes straight back. A calibration error is cleared only by calibrating.
  IN_WATCHDOG_TIMEOUT:
    name: Send_Watchdog
    group: system
    python: Send_Watchdog()
    description: >
      Sets the watchdog. The motion commands (Send_data_pack_1, Send_data_pack_PD, Send_gripper_data_pack) and the
      requests the driver answers (the Send_Respond_ remote frames, Send_Get_Parameter, Send_Buffer_Read) reset it;
      the other frames (Send_Parameter among them) and UART commands do not. When the time runs out the driver
      reports a watchdog error and does what the action byte says. 0 turns it off (the default). From firmware 109
      the driver acts on the action byte, but only when the watchdog is the only active error: any other error
      gets the legacy response, the motor disabled and coasting. Hold and descend run for the fallback time
      (parameter 2, 2 s by default), then the after-action (parameter 5); they start only if the driver was in
      position, velocity, current, PD or gripper mode, otherwise the driver gives the legacy response and the
      motor coasts. Setting the time starts a fresh window, and a negative time means off.
      [The watchdog](../../06-operation/watchdog.md) explains each action. The setting is kept by Send_Save_config.
      The same values are parameters 6 and 7, which `#Par` reaches over UART: to turn off a saved watchdog, send 0
      over CAN or `#Par 6,0`, and save.
    forms:
      - length: 5
        fields:
          - {bytes: "0-3", name: Time, type: unsigned 32-bit, meaning: ms; 0 = off}
          - {bytes: "4", name: Action, type: unsigned 8-bit, meaning: "0 legacy (the motor disabled, coasting), 1 hold the position, 2 brake (not current-limited), 3 coast, 4 descend at the fallback current and speed; other values act as 0"}
    notes: >
      Firmware 107 and older store the action byte without acting on it. The Python library sends all five
      actions from 1.21 ('Idle', 'Hold', 'Brake', 'Coast', 'Descend'); 1.20 and older send only 0, 1 or 2.
  HEARTBEAT_SETUP:
    name: Send_Heartbeat_Setup
    group: system
    python: Send_Heartbeat_Setup()
    description: Sets the heartbeat interval in ms; 0 turns the heartbeat off (the default). Kept by Send_Save_config.
    forms:
      - length: 4
        fields:
          - {bytes: "0-3", name: Interval, type: unsigned 32-bit, meaning: ms; 0 = off}
  IN_SETTINGS:
    name: Send_Settings
    group: system
    python: Send_Settings()
    description: >
      Sets boolean settings that have no command of their own: a mask byte says which settings the frame touches, a
      value byte gives their new values; settings outside the mask are left alone. Bit 0 is the idle behaviour: 1
      brake (phases shorted), 0 coast (the default). From firmware 110 Send_Save_config keeps it; on 109 the driver
      coasted again after a power cycle, as a driver still does that never saved it. Braking applies only in idle without an error; an error always disables the motor, which then
      coasts. The braking current is not limited, see Control modes. Added in firmware 107 (STEPFOC 107). The
      Python library has `Send_Settings(mask, value)` and, for this bit, `Send_Brake_Coast(brake)` from 1.21; 1.20
      and older have no call for it.
    forms:
      - length: 2
        fields:
          - {bytes: "0", name: Mask, type: unsigned 8-bit, meaning: "bit 0 = write the idle behaviour"}
          - {bytes: "1", name: Value, type: unsigned 8-bit, meaning: "bit 0: 1 brake, 0 coast"}
  IN_CYCLIC:
    name: Send_Cyclic_command
    group: system
    description: Reserved. The firmware has no handler for this ID and the Python library's call does nothing.

  # ------------------------------------------------------------ parameters and buffers
  IN_PARAM_SET:
    name: Send_Parameter
    group: parameters
    python: Send_Parameter()
    description: >
      Sets one parameter by its number (the [parameter table](#every-parameter)). Firmware 109 gives new settings
      a parameter number instead of a command ID of their own, since the identifier has room for only 64 command
      IDs. A value outside a parameter's range is clamped, replaced or refused as the table says; a number the
      firmware does not know, or a read-only one, is ignored. The driver does not answer: read the value back with
      Send_Get_Parameter. A value set this way lives in RAM until Send_Save_config, like every other setting; the
      table says which parameters Save keeps.
    forms:
      - length: 5
        fields:
          - {bytes: "0", name: Parameter, type: unsigned 8-bit, meaning: "the parameter number, 1-93"}
          - {bytes: "1-4", name: Value, type: signed 32-bit, meaning: "the new value, in the parameter's unit; for the gains, limits and Kt (8-16, 20) a float's bit pattern"}
    notes: >
      A data frame of another length, or a remote frame, is ignored and flagged as a wrong data length. It does
      not reset the watchdog.
  IN_PARAM_GET:
    name: Send_Get_Parameter
    group: parameters
    python: Send_Get_Parameter()
    description: >
      Asks for the value in force of one parameter. The answer, Respond_Parameter, comes under ID 38, not 37: a
      host and a driver must never send data frames with the same identifier, because two sent at the same
      moment collide. Resets the watchdog. The Python library stores the value in `parameters[number]`.
    forms:
      - length: 1
        fields:
          - {bytes: "0", name: Parameter, type: unsigned 8-bit, meaning: the parameter number}
  OUT_PARAM_VALUE:
    name: Respond_Parameter
    group: parameters
    description: >
      The answer to Send_Get_Parameter: the number and the value in force. For a number the firmware does not
      know the frame carries the number alone (1 byte; the Python library sets `unknown_parameter`). The gains,
      limits and Kt (parameters 8 to 16 and 20) travel as the bit pattern of an IEEE-754 float, the others as
      integers.
    response_fields:
      - {bytes: "0", name: parameter, type: unsigned 8-bit, meaning: the parameter number}
      - {bytes: "1-4", name: value, type: signed 32-bit, meaning: "the value in force; a float's bits for 8-16 and 20"}
  IN_BUFFER_READ:
    name: Send_Buffer_Read
    group: parameters
    python: Send_Buffer_Read()
    description: >
      Asks for entries of one of the drive's buffers: the capture, the histogram, the anti-cogging harmonics or
      table, or the encoder table. The driver answers with one Respond_Buffer_Data frame per entry (for the two
      tables, one per three values), sent from its main loop whenever a transmit mailbox is free, so a long
      read-out never holds up the control loop or other answers. A new request replaces one still in progress;
      count 0 cancels it. Entries past the end are not sent. Resets the watchdog.
    forms:
      - length: 5
        fields:
          - {bytes: "0", name: Kind, type: unsigned 8-bit, meaning: "0 capture (up to 1024 samples: parameter 32 says how many), 1 histogram (256 bins), 2 anti-cogging harmonics (8 slots), 3 anti-cogging table (256 values), 4 encoder table (128 values)"}
          - {bytes: "1-2", name: First, type: unsigned 16-bit, meaning: the first index}
          - {bytes: "3-4", name: Count, type: unsigned 16-bit, meaning: "how many entries; 0 cancels a read-out"}
  OUT_BUFFER_DATA:
    name: Respond_Buffer_Data
    group: parameters
    description: >
      One entry of a buffer, the answer to Send_Buffer_Read. The first two bytes say which: the kind in the top
      three bits, the index in the other thirteen (kind × 8192 + index). The six bytes after them depend on the
      kind, as the table below the frame says.
    response_fields:
      - {bytes: "0-1", name: header, type: unsigned 16-bit, meaning: "kind × 8192 + index"}
      - {bytes: "2-3", name: word_a, type: signed 16-bit, meaning: "capture: channel A; histogram: the count (unsigned); harmonics: the harmonic number (0 = slot unused); tables: entry index"}
      - {bytes: "4-5", name: word_b, type: signed 16-bit, meaning: "capture: channel B; histogram: the sum's upper 16 bits; harmonics: a, the cosine term in mA; tables: entry index + 1"}
      - {bytes: "6-7", name: word_c, type: signed 16-bit, meaning: "capture: channel C; histogram: the sum's lower 16 bits; harmonics: b, the sine term in mA; tables: entry index + 2 (0 past the end)"}
    notes: |
      | Kind | Index | Bytes 2-7 |
      |---|---|---|
      | 0 capture | the sample, oldest first, 0 to parameter 32 − 1 | channels A, B and C, each in its signal's unit (the parameter table lists the signals) |
      | 1 histogram | the bin, 0-255 over one electrical turn or one motor turn | the count (unsigned 16-bit), then the sum (signed 32-bit); the bin's mean is sum ÷ count |
      | 2 anti-cogging harmonics | the slot, 0-7 | the harmonic of the electrical angle (1-32, 0 = unused), a and b in mA: the slot adds a·cos(h·θ) + b·sin(h·θ) |
      | 3 anti-cogging table | the first of three values, 0-255 | three values in mA, 64 angle counts apart (256 per electrical turn) |
      | 4 encoder table | the first of three values, 0-127 | three corrections in 1/16 encoder count, 128 per motor turn |
  IN_BUFFER_WRITE:
    name: Send_Buffer_Write
    group: parameters
    python: Send_Cogging_Harmonic(), Send_Cogging_Table()
    description: >
      Writes the anti-cogging set: kind 2 one harmonic slot per frame, kind 3 three table values per frame, in the
      Respond_Buffer_Data layout. Other kinds are ignored (the encoder table cannot be written), and so is a
      harmonic above 32. The set lives in RAM until Send_Save_config; switch it on with parameter 37. The driver
      does not answer.
    forms:
      - length: 8
        fields:
          - {bytes: "0-1", name: Header, type: unsigned 16-bit, meaning: "kind × 8192 + index; kind 2 or 3"}
          - {bytes: "2-3", name: Word A, type: signed 16-bit, meaning: "kind 2: the harmonic (1-32, 0 = unused); kind 3: value at index"}
          - {bytes: "4-5", name: Word B, type: signed 16-bit, meaning: "kind 2: a in mA; kind 3: value at index + 1"}
          - {bytes: "6-7", name: Word C, type: signed 16-bit, meaning: "kind 2: b in mA; kind 3: value at index + 2"}

  # ------------------------------------------------------------ sound
  IN_SOUND:
    name: Send_Sound
    group: sound
    python: Send_Sound()
    description: >
      Plays sound through the motor: a tone now, a queue of timed events, or samples. The sound is added to the
      output voltage, on the q axis by default (parameter 82), and only while the driver holds or moves (position,
      velocity, current or PD mode); idle or an error stops all of it. Up to 4 tones sound at once (channels 0 to 3),
      from 20 Hz to below 2500 Hz, half the control-loop rate. Loudness is given as a current: the driver turns it into
      a voltage with the coil's impedance at that pitch, so low and high notes sound alike. The total voltage is
      limited to parameter 81 (2000 mV by default; 0 refuses sound). Added in firmware 109. The driver does
      not answer; parameter 80 says what plays. The Python library wraps the operations as Send_Tone,
      Send_Sound_Stop, Send_Sound_Event, Send_Sound_Play, Send_Sound_Clear, Send_Samples_Play and
      Send_Samples_Stop.
    forms:
      - length: 8
        fields:
          - {bytes: "0", name: Operation, type: unsigned 8-bit, meaning: "0 stop everything (tones, queue, samples); 1 a tone now; 2 add an event to the queue; 3 play the queue; 4 play the samples; 5 samples off, buffer cleared; 6 clear the queue (tones that sound keep sounding)"}
          - {bytes: "1", name: Channel, type: unsigned 8-bit, meaning: "the tone channel, 0-3 (operations 1 and 2)"}
          - {bytes: "2-3", name: A, type: unsigned 16-bit, meaning: "1, 2: the pitch in Hz (2: 0 silences the channel); 4: the sample rate in Hz, at most the loop rate"}
          - {bytes: "4-5", name: B, type: unsigned 16-bit, meaning: "1, 2: the loudness in mA; 4: the voltage of a full-scale sample in mV"}
          - {bytes: "6-7", name: C, type: unsigned 16-bit, meaning: "1: the duration in ms, 0 = until stopped; 2: the wait in ms before the next event, 0 = the next one starts with it"}
    notes: >
      The queue holds 31 events and is played by the control loop with loop-exact timing: an event sets one
      channel's pitch and loudness, then waits. A chord is three events with wait 0 and a fourth with the chord's
      length. When the queue runs out, every channel falls silent. An event sent to a full queue is dropped.
      Samples: send them first with Send_Sound_Samples, then operation 4; the driver plays them at the given rate
      and stops when the buffer runs dry. A frame of another length, or a remote frame, is ignored. It does not
      reset the watchdog.
  IN_SOUND_SAMPLES:
    name: Send_Sound_Samples
    group: sound
    python: Send_Samples()
    description: >
      Appends 1 to 8 samples (signed 8-bit, one per byte, −127 to 127 = full scale) to the driver's 1024-place
      sample buffer, which holds 1023 samples. Samples that do not fit are dropped; parameter 80 says how many are
      buffered. Send_Sound with operation 4 plays them. Added in firmware 109. The driver does not answer.
    forms:
      - length: 8
        title: eight samples; a shorter frame carries fewer
        fields:
          - {bytes: "0", name: Sample 1, type: signed 8-bit, meaning: the next sample}
          - {bytes: "1", name: Sample 2, type: signed 8-bit, meaning: ""}
          - {bytes: "2", name: Sample 3, type: signed 8-bit, meaning: ""}
          - {bytes: "3", name: Sample 4, type: signed 8-bit, meaning: ""}
          - {bytes: "4", name: Sample 5, type: signed 8-bit, meaning: ""}
          - {bytes: "5", name: Sample 6, type: signed 8-bit, meaning: ""}
          - {bytes: "6", name: Sample 7, type: signed 8-bit, meaning: ""}
          - {bytes: "7", name: Sample 8, type: signed 8-bit, meaning: ""}

  # ------------------------------------------------------------ gripper
  IN_GRIPPER_DATA_PACK:
    name: Send_gripper_data_pack
    group: gripper
    python: Send_gripper_data_pack()
    description: >
      The gripper command, for a driver set up as a gripper (`#Gripper 1`, saved). Position, speed and the current
      limit of the move, plus the activate, action and E-stop bits. A move is carried out only while the gripper is
      calibrated, activated and the action bit is 1. An empty frame (0 bytes) only asks for the state.
    forms:
      - length: 5
        fields:
          - {bytes: "0", name: Position, type: unsigned 8-bit, meaning: "0 fully open, 255 fully closed"}
          - {bytes: "1", name: Speed, type: unsigned 8-bit, meaning: "0 slowest, 255 fastest"}
          - {bytes: "2-3", name: Current, type: signed 16-bit, meaning: "current limit of the move in mA; from firmware 109 its magnitude is used and it stops at 2800 mA; see the gripper manual for the safe range; from firmware 110 the gripper's own limit, the driver's current limit (parameter 16) stays as set"}
          - {bytes: "4", bit: 7, name: Activate, type: bit, meaning: "1 activate the gripper, 0 deactivate"}
          - {bytes: "4", bit: 6, name: Action, type: bit, meaning: "1 go to the position, 0 idle", _shared: true}
          - {bytes: "4", bit: 5, name: E-stop, type: bit, meaning: 1 raises the gripper E-stop error, _shared: true}
          - {bytes: "4", bit: 4, name: Release direction, type: bit, meaning: read by the firmware but not used, _shared: true}
  IN_GRIPPER_CALIB:
    name: Send_gripper_calibrate
    group: gripper
    python: Send_gripper_calibrate()
    description: >
      Starts the gripper calibration (the jaws find their end stops). Needed after every power-up. From firmware
      110 each end is read under a light push and positions 0 and 255 lie a few ticks inside the two ends; this
      frame sent during a calibration starts it again from its first step. Parameter 93 gives the stroke found.
  OUT_GRIPPER_DATA_PACK:
    name: Respond_Gripper_data_pack
    group: gripper
    description: >
      The driver's answer to Send_gripper_data_pack: position, measured current, and the state bits. Python
      attributes `gripper_position`, `gripper_current`, `gripper_activated`, `gripper_action_status`,
      `gripper_object_detection`, `gripper_temperature_error`, `gripper_timeout_error`, `gripper_estop_error`,
      `gripper_calibrated`. The Python library 1.20 and older combine the two object-detection bits the wrong way
      round, so their `gripper_object_detection` reads 2 for an object found while closing and 1 for one found
      while opening; 1.21 and newer read them as the table says.
    response_fields:
      - {bytes: "0", name: gripper_position, type: unsigned 8-bit, meaning: "0 fully open, 255 fully closed"}
      - {bytes: "1-2", name: gripper_current, type: signed 16-bit, meaning: measured current in mA}
      - {bytes: "3", bit: 7, name: gripper_activated, type: bit, meaning: 1 activated}
      - {bytes: "3", bit: 6, name: gripper_action_status, type: bit, meaning: "the action bit of the last Send_gripper_data_pack (1 after #Grippos); the driver never clears it, so it stays 1 after the move ends: the object detection tells when the move has ended", _shared: true}
      - {bytes: "3", bit: "5-4", name: gripper_object_detection, type: 2 bits, bit_order: lsb_first, meaning: "bit 5 is the low bit, bit 4 the high bit: 0 moving, 1 object detected while closing, 2 object detected while opening, 3 at the position", _shared: true}
      - {bytes: "3", bit: 3, name: gripper_temperature_error, type: bit, meaning: the driver's temperature error, _shared: true}
      - {bytes: "3", bit: 2, name: gripper_timeout_error, type: bit, meaning: "the driver's watchdog error: the CAN watchdog ran out", _shared: true}
      - {bytes: "3", bit: 1, name: gripper_estop_error, type: bit, meaning: "", _shared: true}
      - {bytes: "3", bit: 0, name: gripper_calibrated, type: bit, meaning: 1 calibrated, _shared: true}
