# The hand-written half of the UART reference: what each command is for, its argument and what the response means.
# The other half (which commands exist, Set/Get or action, the argument type, the mode a command enters, what it
# prints) comes from the firmware at its release tag (generated/firmware_facts.json), and the build fails when the
# two disagree. Keys are the command names exactly as the firmware compares them (case matters).

groups:
  motion:
    title: Motion
    page: motion.md
  gains:
    title: Gains and limits
    page: gains.md
  calibration:
    title: Calibration and motor parameters
    page: calibration.md
  utility:
    title: Status and utility
    page: utility.md
  gripper:
    title: Gripper
    page: gripper.md

commands:
  # ------------------------------------------------------------ motion
  Iq: {group: motion, argument: current setpoint in mA, description: Current (torque) control with the given Iq setpoint., response: the measured Iq in mA}
  Id: {group: motion, argument: current setpoint in mA, description: "Sets the Id setpoint; normally left at 0. Also parameter 58.", response: the measured Id in mA}
  V: {group: motion, argument: speed setpoint in encoder ticks/s, description: Velocity control with the given speed., response: the measured speed in ticks/s}
  P: {group: motion, argument: position setpoint in encoder ticks, description: Position control to the given position., response: the measured position in ticks}
  PD: {group: motion, argument: position setpoint in encoder ticks, description: Impedance (PD) control around the given position with the gains KP and KD., response: the measured position in ticks}
  PDV: {group: motion, argument: speed setpoint in encoder ticks/s, description: The speed setpoint of the PD loop., response: the PD speed setpoint}
  PDI: {group: motion, argument: current feedforward in mA, description: The current feedforward of the PD loop., response: the PD current feedforward}
  Uq: {group: motion, argument: voltage in mV, description: Voltage-torque mode with the given q-axis voltage (no current loop)., response: the Uq setpoint in mV}
  Ud: {group: motion, argument: voltage in mV, description: The d-axis voltage used in voltage-torque mode; does not change the mode., response: the Ud setpoint in mV}
  Openloop: {group: motion, argument: electrical speed in rad/s, description: "Turns the stator field at the given electrical speed without the encoder in the loop, with the voltage set by Openv. Without a number it still starts the motor, at the stored speed: `#Openloop` alone is not a query. The speed is the same setting as `#Opens`.", response: the open-loop speed}
  Idle: {group: motion, description: Goes to idle; the motor coasts or brakes as set by Brake., response: "`Idle`"}
  Brake: {group: motion, argument: 0 or 1, description: "What the motor does in idle: 1 brakes (the phases are shorted through the driver), 0 coasts (the phases are open, the default). Takes effect once the driver is idle, so send Idle first. Not saved: the driver coasts again after a power cycle. An error always disables the motor, which then coasts. The braking current is not limited, see Control modes. Added in firmware 107.", response: the setting}
  Close: {group: motion, description: Leaves open loop and goes back to closed-loop idle., response: nothing}

  # ------------------------------------------------------------ gains and limits
  Kpp: {group: gains, argument: gain, description: Kp of the position loop., response: the current value}
  Kpv: {group: gains, argument: gain, description: Kp of the velocity loop., response: the current value}
  Kiv: {group: gains, argument: gain, description: Ki of the velocity loop., response: the current value}
  Kpiq: {group: gains, argument: gain, description: Kp of the Iq current loop; also sets Kpid., response: the current value}
  Kiiq: {group: gains, argument: gain, description: Ki of the Iq current loop; also sets Kiid., response: the current value}
  Kpid: {group: gains, argument: gain, description: Kp of the Id current loop., response: the current value}
  Kiid: {group: gains, argument: gain, description: Ki of the Id current loop., response: the current value}
  KP: {group: gains, argument: gain, description: KP of the impedance (PD) loop., response: the current value}
  KD: {group: gains, argument: gain, description: KD of the impedance (PD) loop., response: the current value}
  Vlimit: {group: gains, argument: speed in encoder ticks/s, description: "The speed limit: the speed the position loop may command, and the largest velocity setpoint. (The velocity integrator is clamped to the current limit.)", response: the current limit}
  Ilim: {group: gains, argument: current in mA, description: The Iq current limit. Set it to the rated phase current of your motor; the firmware clamps it to 2800 mA., response: the current limit}
  Vlim: {group: gains, argument: voltage in mV, description: The voltage limit of the current loops (Ud and Uq); 0 means use the supply voltage., response: the current limit in mV}
  Rstint: {group: gains, argument: 0 or 1, description: Whether the integral accumulators are reset on every new setpoint., response: the setting}
  Cbw: {group: gains, argument: "bandwidth in Hz, 10 to 500", description: "The current loop bandwidth. From firmware 109 setting it computes Kpiq and Kiiq at once from R and L, the way calibration does, and prints them (the same as parameter 49); a value outside 10-500, or with R or L at 0, changes nothing. Not saved: 160 Hz after a power cycle, but the gains it set are kept by Save.", response: "the bandwidth, then `Kp_iq = …, Ki_iq = …`"}

  # ------------------------------------------------------------ calibration and motor parameters
  Cal: {group: calibration, description: "Runs the calibration routine (see Calibration): it measures R and L, finds the pole pairs, the phase order and the angle offset, and measures Kt, KV and the flux linkage. It uses its own 1600 mA current limit for its steps; from firmware 109 it puts the limit that was in force back when it ends. From firmware 109, when it succeeds, what parameter 56 names follows by itself; its default on the Spectral Micro is 0, nothing.", response: the calibration log}
  Calonly: {group: calibration, description: "The calibration alone: like Cal, but nothing of parameter 56 follows, this once. Added in firmware 109.", response: the calibration log}
  Encal: {group: calibration, argument: "nothing, or save, all, stop, on, off, state", description: "The encoder table (see Encoder table and anti-cogging). Alone it measures the table and uses it: the field turns the rotor open loop one shaft turn each way at 2048 ticks/s, about 20 s, with the shaft free. `save` also saves; `all` then identifies the anti-cogging and saves both; `stop` aborts; `on` and `off` switch the correction (on only with a measured table); `state` only prints. The same as parameters 52 and 53. Added in firmware 109; not yet tested on a Spectral Micro.", response: "`Encoder table: <state>`, then the table's error in degrees"}
  Cogcal: {group: calibration, argument: "nothing, or save, trim, stop, state", description: "The anti-cogging identification on the drive (see Encoder table and anti-cogging): one motor turn forward and one back in velocity mode at parameter 44's speed (1500 ticks/s, about 22 s), the shaft free to turn. `save` also saves; `stop` aborts; `state` only prints. `trim` identifies like the plain command on the Spectral Micro: its firmware skips the current-sense trim. It prints `idle` for the states 7 to 11, which parameter 43 tells apart. Added in firmware 109; not yet tested on a Spectral Micro.", response: "`Anti-cogging identification: <state>`, the speed and the identified cogging in mA rms, and the harmonics when done"}
  R: {group: calibration, argument: resistance in Ω, description: "The phase resistance of the motor, measured by Cal; it can also be set by hand. Also parameter 76, in mΩ.", response: the current value}
  L: {group: calibration, argument: inductance in H, description: "The phase inductance of the motor, measured by Cal; it can also be set by hand. Also parameter 77, in µH.", response: the current value}
  PP: {group: calibration, argument: pole pairs, description: "The motor's pole pairs, found by Cal; they can also be set by hand. Also parameter 78.", response: the current value}
  Kt: {group: calibration, argument: Nm/A, description: "The torque constant, found by calibration.", response: the current value}
  KV: {group: calibration, argument: rpm/V, description: "The velocity constant, found by calibration.", response: the current value}
  Flux: {group: calibration, argument: Wb, description: "The flux linkage, found by calibration. Works over UART from firmware 109; the parser of 107 and older accepted only the lowercase `#flux`, which had no handler.", response: the current value}
  Offset: {group: calibration, argument: angle in rad, description: "The angle offset between encoder zero and electrical zero, found by calibration.", response: the current value}
  Iqoffset: {group: calibration, argument: current in mA, description: "The current used by the angle-offset search and the commutation check of Cal, 300 mA by default. Not saved.", response: the current value}
  Magnet: {group: calibration, description: Reads the encoder's magnet status., response: "`Magnet Good` or `Magnet Bad`"}
  Dir: {group: calibration, argument: 0 or 1, description: "The counting direction of the encoder, set by calibration (0 after `#Default`).", response: the current value}
  Phase: {group: calibration, description: Prints the phase order found by calibration., response: "`Phase order is: N`"}
  Resv: {group: calibration, argument: voltage in mV, description: The voltage the resistance test of Cal starts at; it rises until the power reaches Calpwr. Not saved., response: the current value}
  Calpwr: {group: calibration, argument: power in W, description: The power the resistance and inductance tests of Cal may dissipate in the motor. Not saved., response: the current value}
  Openv: {group: calibration, argument: voltage in mV, description: "The voltage of the open-loop spin, in calibration and with Openloop. Not saved.", response: the current value}
  Opens: {group: calibration, argument: electrical speed in rad/s, description: "The speed of the open-loop spin in calibration; the same setting as the speed of `#Openloop`.", response: the current value}
  Vp: {group: calibration, argument: voltage in mV, description: The voltage of the phase-order search in calibration. Not saved., response: the current value}
  Calibrated: {group: calibration, argument: 0 or 1, description: "The calibrated flag. `#Calibrated 1` clears a calibration error without calibrating; the motor may still be uncalibrated.", response: the flag}

  # ------------------------------------------------------------ status and utility
  Save: {group: utility, description: Writes the configuration to the EEPROM. Do it after calibration and after tuning., response: "`Save`"}
  Reset: {group: utility, description: "Resets the driver. From firmware 104 the reset lands in the bootloader, which waits 2 s for a flashing host and then starts the firmware again.", response: nothing}
  Default: {group: utility, description: "Writes the factory defaults to the EEPROM and loads them: the calibration is erased (Not calibrated), the gripper flag, heartbeat and watchdog are cleared, the hardware version and batch date are set to 1 and 24092024, and 1111 is stored as the serial number; from firmware 109 also the tool id (0), the watchdog fallback, and the anti-cogging set, the encoder table, its trims and parameter 56 (cleared). From firmware 109 the CAN node ID is kept (0 only when no valid one is stored). Note the values first.", response: "`Loaded default config!`"}
  Pullconfig: {group: utility, description: "Prints the whole configuration on one line, for Motor GUI.", response: the configuration}
  Info: {group: utility, description: "Prints the driver's identity and the motor: hardware version, batch date, firmware version, ISR time, CAN ID, calibrated or not, temperature, Vbus, Dir, phase order, commutation direction, the speeds of the calibration spin, pole pairs, R, L, Kt and KV. From firmware 109 also the CAN receive overruns and dropped transmits, the product, the current-sense zeros, the tool id, the watchdog and its fallback, settings block 2, the anti-cogging, and at the end the `In force:` section (see Status and diagnostics). The serial number is `#SERNUM`, the gains `#Param`, the errors `#Error`.", response: the report}
  Tone: {group: utility, argument: "f,mA[,ms], or off", description: "A tone through the motor (see Sound): `#Tone 440,250,1000` plays 440 Hz at a loudness of 250 mA for 1000 ms, on the axis parameter 82 picks. mA left out: 200; ms left out: 500; ms 0: until `#Tone off`. 20 Hz up to below 2500 Hz. It plays only while the driver holds or moves; from idle a calibrated driver first holds the position it is at (`#Idle` releases it). `#Tone` alone or `#Tone off` stops all sound. Added in firmware 109.", response: "`Tone 440 Hz, 250 mA, 1000 ms`; from idle first `Holding the position while it plays (#Idle releases it)`; `Tone: not played (…)` when it cannot; `Tone off`"}
  Par: {group: utility, argument: "n, or n,value", description: "Any parameter by its number (see Parameters and buffers): alone it lists every parameter, `#Par 56` reads one, `#Par 56,0` sets it (no spaces). Added in firmware 109.", response: "`P<n> = <value>`; `refused: out of range, read only, not now, or unknown` when the driver did not take it; `P<n> unknown`"}
  Tool: {group: utility, argument: 0 to 255, description: "The tool id: what the drive is built into, 0 none, 1 SSG-48, 11-33 MSG (tens = rail 1/2/3 = 100/150/200 mm, units = stepper 1/2/3 = 21.5/40/60 mm), 200-254 your own. The same as parameter 1. Kept by Save. Added in firmware 109.", response: "`Tool ID: N`, or `Invalid tool id (0-255)`"}
  WdFb: {group: utility, argument: "time_ms,current_mA,speed_ticks_s,after_action", description: "The watchdog fallback, four numbers at once without spaces, e.g. `#WdFb 2000,0,1000,2`: how long hold or descend runs, descend's current and speed cap, and what follows (0 legacy, 2 brake, 3 coast). The same as parameters 2 to 5, clamped the same way; fewer than four numbers change nothing. Kept by Save. Added in firmware 109.", response: "`Watchdog fallback: … ms, … mA, … ticks/s, then …`"}
  Product: {group: utility, argument: "nothing, or claim, clear", description: "The product lock: prints this firmware and the board's stamp. `claim` stamps the board as this product (a repaired board, a motor the stamp rule misjudges), `clear` removes the stamp; power-cycle after either. Over UART only. Added in firmware 109.", response: "`Firmware: Spectral Micro; board stamp: …`"}
  Param: {group: utility, description: Prints every gain of every loop., response: the gains}
  Help: {group: utility, description: Prints a short command reference. Added in firmware 106., response: the reference}
  Error: {group: utility, description: Prints which errors are active., response: "`No errors!` or `In error state!`, then one line per active error (see Errors and LED states), and `FAULT pin is HIGH` while the driver stage's fault pin is active"}
  Clear: {group: utility, description: "Clears the errors and goes to idle. An error whose cause is still present comes straight back; a calibration error is cleared only by calibrating (or `#Calibrated 1`).", response: "`Clear errors`"}
  Mode: {group: utility, description: "Prints the control mode. In voltage-torque mode (`#Uq`) it prints nothing.", response: "`Idle mode`, `Position control`, `Speed control`, `Current control`, `PD control`, `Open loop`, `Gripper mode`, `Gripper calib mode`"}
  Vbus: {group: utility, description: Prints the supply voltage., response: mV}
  Vmax: {group: utility, argument: voltage in mV, description: "The supply voltage above which a Vbus error is raised: 29000 mV after `#Default`.", response: "`Vmax in mV: N`"}
  Temp: {group: utility, description: Prints the thermistor temperature., response: "°C, or `Temp Off` while the thermistor is disabled"}
  Term: {group: utility, argument: 0 or 1, description: Enables the thermistor measurement and the temperature error (off by default)., response: the setting}
  Tlim: {group: utility, argument: temperature in °C, description: The temperature at which the temperature error is raised; 75 by default., response: "`Temp limit N`"}
  Iabc: {group: utility, description: Prints the phase currents., response: "`Ia`, `Ib`, `Ic` in mA"}
  PWM: {group: utility, description: Prints the PWM duty values., response: the duties}
  LED: {group: utility, argument: 0 or 1, description: Turns the status LED on or off., response: the LED state}
  CANID: {group: utility, argument: 0 to 13, description: "The CAN node ID. Use 0 to 13: the firmware accepts 14 and 15, but the bootloader reserves them and a driver on one of those cannot be updated over CAN. Kept over a power cycle after Save, which also copies it into the bootloader's board ID; from firmware 109 Default and a settings reset keep it too.", response: "the ID, or `Invalid CAN ID`"}
  SERNUM: {group: utility, argument: number, description: "The serial number. Save writes it to the EEPROM, but the firmware does not read it back at power-up: after a power cycle the driver reports 1.", response: "`Serial number is: N`"}
  Activate: {group: utility, description: "Sets the controller's activated flag (bit 6 of byte 1 of Send_Respond_State_of_Errors). It is not the gripper's activate bit, which `#Gripact` and Send_gripper_data_pack set.", response: "`Controller activated`"}
  Cyc: {group: utility, argument: interval in ms (0 = off), description: "Sends position, speed and Iq on its own every interval: `$ <position> <speed> <Iq>`; for BetterSerialPlotter.", response: "`Cyclic disabled` for `#Cyc` without a number; `#Cyc 0` stops the output without an answer"}
  Cyca: {group: utility, argument: interval in ms (0 = off), description: "Like Cyc, in the Arduino plotter format `Position:x,Speed:y,Iq:z`.", response: "`Cyclic disabled` for `#Cyca` without a number; `#Cyca 0` stops the output without an answer"}

  # ------------------------------------------------------------ gripper
  Gripper: {group: gripper, argument: 0 or 1, description: "Whether this driver is a gripper. Save it; `#Default` clears it.", response: the flag}
  Gripcal: {group: gripper, description: Starts the gripper calibration (the jaws find their end stops)., response: "`Gripper calibration!`"}
  Grippos: {group: gripper, argument: 0 (open) to 255 (closed), description: "The position setpoint; also activates the gripper, sets the action bit and goes to gripper mode.", response: the current position}
  Gripvel: {group: gripper, argument: 0 to 255, description: The speed setpoint of gripper moves., response: the setpoint}
  Gripcur: {group: gripper, argument: current in mA, description: The current limit of gripper moves. The firmware does not clamp it; see the gripper manual for the safe range., response: the setpoint}
  Gripact: {group: gripper, argument: 0 or 1, description: The activate bit., response: the bit}
  Gripstop: {group: gripper, argument: 0 or 1, description: The gripper E-stop bit., response: the bit}
  Gripinfo: {group: gripper, description: "Prints the gripper state: whether the driver is a gripper, calibrated, activated, the position, speed and current setpoints, the E-stop, action and object-detection status, and the end stops.", response: the report}
